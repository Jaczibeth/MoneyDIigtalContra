<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Historial General - Money Digital | GROUP JAD</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-dark: rgba(255, 255, 255, 0.06);
            --border-dark: rgba(255, 255, 255, 0.12);
            --neon-cyan: #00eaff;
            --neon-purple: #b400ff;
            --text-light: #e5e5e5;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-light);
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--border-dark);
            padding: 20px 40px;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #bbb;
            padding: 10px 18px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: 500;
            text-decoration: none;
        }

        nav a:hover,
        nav a.active {
            background: rgba(0, 255, 255, 0.1);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            padding: 24px;
            transition: 0.3s;
        }
    </style>
  <script src="js/api-client.js"></script>
</head>

<body>
    <header class="flex justify-between items-center">
        <h1 class="text-2xl font-bold"
            style="background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; color: transparent;">
            Money Digital - GROUP JAD
        </h1>
        <nav class="flex gap-6">
            <a href="Inicio.html">🏠 Inicio</a>
            <a href="gestion-actividades.html">📝 Actividades</a>
            <a href="revision-actividades.html">📋 Revisar</a>
            <a href="historial-docente.html" class="active">📊 Historial</a>
            <a href="contador.html">🔐 DApp</a>
        </nav>
    </header>

    <div class="max-w-6xl mx-auto mt-12 px-6 pb-12">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-bold mb-4"
                style="background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; color: transparent;">
                Historial General
            </h2>
            <p class="text-gray-400">Actividades aprobadas, tokens entregados y recompensas canjeadas</p>
        </div>

        <!-- Tabs -->
        <div class="card mb-6">
            <div class="flex gap-4 border-b" style="border-color: var(--border-dark);">
                <button class="tab-btn active px-4 py-2 font-semibold" data-tab="approved">Aprobadas</button>
                <button class="tab-btn px-4 py-2 font-semibold" data-tab="tokens">Tokens Entregados</button>
                <button class="tab-btn px-4 py-2 font-semibold" data-tab="rewards">Recompensas Canjeadas</button>
            </div>
        </div>

        <!-- Contenido -->
        <div id="tabApproved" class="tab-content">
            <div id="approvedList" class="space-y-4">
                <div class="card text-center py-12">
                    <p class="text-gray-400">Cargando...</p>
                </div>
            </div>
        </div>

        <div id="tabTokens" class="tab-content hidden">
            <div id="tokensList" class="space-y-4">
                <div class="card text-center py-12">
                    <p class="text-gray-400">Cargando...</p>
                </div>
            </div>
        </div>

        <div id="tabRewards" class="tab-content hidden">
            <div id="rewardsList" class="space-y-4">
                <div class="card text-center py-12">
                    <p class="text-gray-400">Cargando...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/activities-system.js"></script>
    <script>
        // Verificación de sesión
        (function () {
            const currentUserStr = sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser');
            if (!currentUserStr) {
                alert('Por favor, inicia sesión para acceder a esta página.');
                window.location.href = 'index.html';
                return;
            }

            const currentUser = JSON.parse(currentUserStr);
            if (currentUser.role !== 'docente') {
                alert('Esta página es solo para docentes.');
                window.location.href = 'Inicio.html';
                return;
            }
        })();

        let currentTab = 'approved';

        function loadHistory() {
            if (typeof activitiesSystem === 'undefined') {
                setTimeout(loadHistory, 100);
                return;
            }

            const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser'));
            const activities = activitiesSystem.getActivities().filter(a => a.createdBy === currentUser.username);
            const allSubmissions = activitiesSystem.getSubmissions();
            const approvedSubmissions = allSubmissions.filter(s => {
                const activity = activitiesSystem.getActivityById(s.activityId);
                return s.status === 'approved' && activity && activity.createdBy === currentUser.username;
            });

            loadApproved(approvedSubmissions);
            loadTokens(approvedSubmissions);
            loadRewards();
        }

        function loadApproved(submissions) {
            const container = document.getElementById('approvedList');

            if (submissions.length === 0) {
                container.innerHTML = `
                    <div class="card text-center py-12">
                        <p class="text-gray-400">No hay actividades aprobadas aún.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = submissions
                .sort((a, b) => new Date(b.reviewedAt) - new Date(a.reviewedAt))
                .map(submission => {
                    const activity = activitiesSystem.getActivityById(submission.activityId);
                    return `
                        <div class="card">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-semibold mb-1">${escapeHtml(activity.title)}</p>
                                    <p class="text-sm text-gray-400">Estudiante: ${escapeHtml(submission.studentUsername)}</p>
                                    <p class="text-sm text-gray-400">Aprobada: ${new Date(submission.reviewedAt).toLocaleString()}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xl font-bold text-green-400">+${submission.tokensAwarded || 0} tokens</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        function loadTokens(submissions) {
            const container = document.getElementById('tokensList');
            const totalTokens = submissions.reduce((sum, s) => sum + (s.tokensAwarded || 0), 0);

            container.innerHTML = `
                <div class="card mb-6 text-center">
                    <div class="text-4xl font-bold mb-2" style="color: var(--neon-cyan);">${totalTokens}</div>
                    <div class="text-gray-400">Total de Tokens Entregados</div>
                </div>
                ${submissions.length === 0 ? `
                    <div class="card text-center py-12">
                        <p class="text-gray-400">No hay tokens entregados aún.</p>
                    </div>
                ` : submissions.map(s => {
                const activity = activitiesSystem.getActivityById(s.activityId);
                return `
                        <div class="card">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-semibold">${escapeHtml(s.studentUsername)}</p>
                                    <p class="text-sm text-gray-400">${escapeHtml(activity.title)}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xl font-bold text-green-400">+${s.tokensAwarded || 0} tokens</p>
                                    <p class="text-xs text-gray-500">${new Date(s.reviewedAt).toLocaleDateString()}</p>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('')}
            `;
        }

        function loadRewards() {
            const container = document.getElementById('rewardsList');
            const redemptions = activitiesSystem.getRedemptions();

            if (redemptions.length === 0) {
                container.innerHTML = `
                    <div class="card text-center py-12">
                        <p class="text-gray-400">No hay recompensas canjeadas aún.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = redemptions
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .map(redemption => {
                    return `
                        <div class="card">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p class="font-semibold mb-1">${escapeHtml(redemption.rewardName)}</p>
                                    <p class="text-sm text-gray-400">Estudiante: ${escapeHtml(redemption.username)}</p>
                                    <p class="text-sm text-gray-400">${new Date(redemption.timestamp).toLocaleString()}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xl font-bold text-red-400">-${redemption.cost} tokens</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                currentTab = tab;

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

                btn.classList.add('active');
                document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
            });
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cargar historial al iniciar
        loadHistory();
    </script>
</body>

</html>
