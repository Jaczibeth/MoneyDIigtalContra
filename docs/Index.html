<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Money Digital - Inicio de Sesión | GROUP JAD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/modern-theme.css">
  
  <!-- Stellar SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.2.2/stellar-sdk.min.js"></script>
  <!-- Freighter API -->
  <script src="https://unpkg.com/@stellar/freighter-api@4.1.0/dist/freighter-api.min.js"></script>

<body>
  
  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="glass-card max-w-md w-full fade-in">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold glow mb-2" style="font-family: 'Poppins', sans-serif;">Money Digital</h1>
        <p class="text-neon-cyan text-sm">Dinero Inteligente, Futuro Brillante</p>
        <p class="text-text-soft mt-2 text-xs">GROUP JAD</p>
      </div>
      
      <h2 class="text-2xl font-bold text-center mb-6" style="font-family: 'Poppins', sans-serif;">Inicio de Sesión</h2>
      
      <!-- Estado de conexión de wallet -->
      <div id="walletStatus" class="message info hidden mb-4">
        <p id="walletAddress" class="text-sm font-mono"></p>
      </div>
      
      <form id="loginForm" class="space-y-6">
        <div>
          <label for="username" class="block mb-2">Nombre de usuario o correo</label>
          <input id="username" type="text" placeholder="Ingrese su nombre de usuario o correo" class="form-input" required autocomplete="off" />
        </div>

        <div>
          <label for="loginPassword" class="block mb-2">Contraseña</label>
          <input id="loginPassword" type="password" placeholder="Introduce tu contraseña" class="form-input" />
        </div>

        <!-- Sección para cuenta Stellar -->
        <div id="stellarAccountSection" class="glass-card" style="background: rgba(0, 234, 255, 0.05); border-color: rgba(0, 234, 255, 0.2);">
          <h3 class="text-lg font-semibold mb-4 text-neon-cyan">🔐 Cuenta Stellar Testnet</h3>
          
          <!-- Opción rápida: usar claves del usuario -->
          <button id="usarClavesUsuario" type="button" class="btn btn-primary w-full mb-3">
            🔑 Usar mis claves (Recomendado)
          </button>
          
          <div class="relative my-4">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t" style="border-color: var(--border-color);"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-4" style="background: var(--bg-card); color: var(--text-muted);">O</span>
            </div>
          </div>
          
          <div class="flex flex-col gap-2">
            <button id="conectarFreighter" type="button" class="btn btn-secondary w-full">
              🔐 Conectar con Freighter Wallet
            </button>
            <button id="crearCuenta" type="button" class="btn btn-primary w-full">
              ➕ Crear nueva cuenta
            </button>
          </div>
          
          <div class="relative my-4">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t" style="border-color: var(--border-color);"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-4" style="background: var(--bg-card); color: var(--text-muted);">O usar clave manual</span>
            </div>
          </div>
          
          <label class="block mb-2">
            <span class="text-sm">Clave secreta (S...):</span>
            <input type="password" id="claveSecretaManual" class="form-input mt-1" placeholder="S..." />
          </label>
          <button id="usarCuentaExistente" type="button" class="btn btn-secondary w-full mt-2">
            🔓 Usar cuenta existente
          </button>
          
          <div id="stellarAccountInfo" class="text-xs font-mono mt-3 p-3 rounded" style="background: rgba(0, 0, 0, 0.3); color: var(--text-soft); white-space: pre-wrap; max-height: 200px; overflow-y: auto;"></div>
        </div>
        
        <div>
          <label class="block mb-2">Cargar Imagen (Opcional)</label>
          <div id="imageUpload" class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer transition duration-200" style="border-color: var(--border-color);">
            <p style="color: var(--text-soft);">Arrastra y suelta una imagen aquí o haz clic para seleccionar</p>
            <input type="file" accept="image/*" class="hidden" />
          </div>
        </div>
        
        <div class="flex justify-between items-center mt-6">
          <a href="Register.html" class="text-neon-cyan hover:underline text-sm">Crear nueva cuenta</a>

      <div id="result" class="message hidden mt-4"></div>

  <!-- Scripts -->
  <script src="js/wallet-manager.js"></script>
  <script>
    // Variables del contrato
    const CONTRACT_ID = 'CDS3VGIAZFIZUG3GL6LWAXLOXWCRIIBDPPRS4225LLLEHPGTFDNF4PQK';
    const RPC_URL = 'https://horizon-testnet.stellar.org';
    const SOROBAN_RPC_URL = 'https://rpc-testnet.stellar.org';
    
    // Claves del usuario por defecto
    const USER_SECRET_KEY = 'SD4ZN2WZKRGHJXKOA4TZ3LDW4JY43LT6RU4YSD6PVJ7IRMLDW4EPOPET';
    const USER_PUBLIC_KEY = 'GAX6QLY4HV23XBE3E7WBMUXKJ3Y7BS6CWF6JBE7U5TEOFEK5P6H2QYYD';
    
    // Limpieza automática de usuarios de prueba
    (function cleanTestUsersImmediate(){
      try {
        const raw = localStorage.getItem('users');
        if (!raw) return;
        const users = JSON.parse(raw);
        if (!Array.isArray(users) || users.length === 0) return;
        const filtered = users.filter(u => {
          if (!u || !u.username) return false;
          const name = String(u.username).trim().toLowerCase();
          if (name.length === 0) return false;
          if (name.includes('monserrat')) return false;
          return true;
        });
        if (filtered.length !== users.length) {
          try { localStorage.setItem('users_backup_' + Date.now(), raw); } catch(e){}
          localStorage.setItem('users', JSON.stringify(filtered));
          try { localStorage.removeItem('stellarPublic'); } catch(e){}
          console.log('Usuarios de prueba eliminados automáticamente.');
        }
      } catch (e) {
        console.warn('Error en limpieza automática de usuarios:', e);
      }
    })();
    
    // Variables globales
    let connectedWallet = null;
    let publicKey = null;
    let ultimaClavePublica = null;
    let ultimaClaveSecreta = null;
    let modoManual = false;

    // Elementos del DOM
    const imageUploadDiv = document.getElementById('imageUpload');
    const fileInput = imageUploadDiv.querySelector('input[type="file"]');
    const walletStatus = document.getElementById('walletStatus');
    const walletAddress = document.getElementById('walletAddress');
    const loginBtn = document.getElementById('loginBtn');
    const loginForm = document.getElementById('loginForm');
    const result = document.getElementById('result');
    const stellarAccountInfo = document.getElementById('stellarAccountInfo');
    const usarClavesUsuarioBtn = document.getElementById('usarClavesUsuario');
    const conectarFreighterBtn = document.getElementById('conectarFreighter');
    const crearCuentaBtn = document.getElementById('crearCuenta');
    const usarCuentaExistenteBtn = document.getElementById('usarCuentaExistente');
    const claveSecretaManualInput = document.getElementById('claveSecretaManual');

    // Función para actualizar UI de wallet
    function updateWalletUI(pk, method = 'manual') {
      publicKey = pk;
      ultimaClavePublica = pk;
      connectedWallet = pk;
      modoManual = (method === 'manual');
      
      walletAddress.textContent = `Cuenta ${method === 'freighter' ? 'Freighter' : 'manual'}: ${pk.substring(0,10)}...${pk.substring(pk.length - 10)}`;
      walletStatus.classList.remove('hidden');
      walletStatus.className = `message ${method === 'freighter' ? 'success' : 'info'}`;
      loginBtn.disabled = false;
    }

    // Usar claves del usuario (recomendado)
    usarClavesUsuarioBtn.addEventListener('click', async () => {
      stellarAccountInfo.textContent = "Conectando con tus claves...";
      try {
        if (typeof window.walletManager !== 'undefined') {
          const result = await window.walletManager.connectWithSecretKey(USER_SECRET_KEY);
          updateWalletUI(result.publicKey, 'manual');
          
          // Verificar balance
          const balance = await window.walletManager.getBalance();
          stellarAccountInfo.textContent = `✅ Cuenta conectada\nPublic Key: ${result.publicKey}\nBalance: ${balance.formatted}`;
          
          if (balance.needsFunding) {
            const fund = confirm('Tu cuenta necesita fondos. ¿Deseas financiarla con friendbot?');
            if (fund) {
              stellarAccountInfo.textContent += '\n\nFinanciando cuenta...';
              await window.walletManager.fundAccount();
              stellarAccountInfo.textContent += '\n✅ Cuenta financiada exitosamente';
            }
          }
        } else {
          // Fallback si wallet-manager no está disponible
          const pair = StellarSdk.Keypair.fromSecret(USER_SECRET_KEY);
          updateWalletUI(pair.publicKey(), 'manual');
          localStorage.setItem('stellarSecret', USER_SECRET_KEY);
          localStorage.setItem('stellarPublic', USER_PUBLIC_KEY);
          stellarAccountInfo.textContent = `✅ Cuenta conectada\nPublic Key: ${USER_PUBLIC_KEY}`;
        }
      } catch (error) {
        stellarAccountInfo.textContent = `❌ Error: ${error.message}`;
        stellarAccountInfo.className = 'message error';
      }
    });

    // Conectar con Freighter
    conectarFreighterBtn.addEventListener('click', async () => {
      stellarAccountInfo.textContent = "Conectando con Freighter...";
      try {
        if (typeof window.walletManager !== 'undefined') {
          const result = await window.walletManager.connectWithFreighter();
          updateWalletUI(result.publicKey, 'freighter');
          const balance = await window.walletManager.getBalance();
          stellarAccountInfo.textContent = `✅ Conectado con Freighter\nPublic Key: ${result.publicKey}\nBalance: ${balance.formatted}`;
        } else {
          if (typeof window.freighterApi === 'undefined') {
            throw new Error('Freighter Wallet no está instalado');
          }
          const isAllowed = await window.freighterApi.isAllowed();
          if (!isAllowed) await window.freighterApi.setAllowed();
          const pk = await window.freighterApi.getPublicKey();
          updateWalletUI(pk, 'freighter');
          stellarAccountInfo.textContent = `✅ Conectado con Freighter\nPublic Key: ${pk}`;
        }
      } catch (error) {
        stellarAccountInfo.textContent = `❌ Error: ${error.message}`;
        stellarAccountInfo.className = 'message error';
      }
    });

    // Crear nueva cuenta
    crearCuentaBtn.addEventListener('click', async () => {
      stellarAccountInfo.textContent = "Generando nueva cuenta...";
      try {
        const pair = StellarSdk.Keypair.random();
        const pk = pair.publicKey();
        const sk = pair.secret();
        
        stellarAccountInfo.textContent = `Nueva cuenta generada:\nPublic Key: ${pk}\nSecret Key: ${sk}\n\nFinanciando cuenta...`;
        
        const response = await fetch(`https://friendbot.stellar.org?addr=${encodeURIComponent(pk)}`);
        const json = await response.json();
        
        await new Promise(r => setTimeout(r, 2000));
        const server = new StellarSdk.Server("https://horizon-testnet.stellar.org");
        const account = await server.loadAccount(pk);
        
        updateWalletUI(pk, 'manual');
        ultimaClaveSecreta = sk;
        localStorage.setItem('stellarSecret', sk);
        localStorage.setItem('stellarPublic', pk);
        
        stellarAccountInfo.textContent += `\n✅ Cuenta financiada\nBalance: ${account.balances.find(b => b.asset_type === 'native')?.balance || '0'} XLM`;
      } catch (error) {
        stellarAccountInfo.textContent = `❌ Error: ${error.message}`;
        stellarAccountInfo.className = 'message error';
      }
    });

    // Usar cuenta existente con clave secreta
    usarCuentaExistenteBtn.addEventListener('click', async () => {
      const claveSecreta = claveSecretaManualInput.value.trim();
      if (!claveSecreta.startsWith("S") || claveSecreta.length < 10) {
        stellarAccountInfo.textContent = "❌ Clave secreta inválida";
        stellarAccountInfo.className = 'message error';
        return;
      }
      
      stellarAccountInfo.textContent = "Cargando cuenta...";
      try {
        const pair = StellarSdk.Keypair.fromSecret(claveSecreta);
        const pk = pair.publicKey();
        
        const server = new StellarSdk.Server("https://horizon-testnet.stellar.org");
        try {
          const account = await server.loadAccount(pk);
          const balance = account.balances.find(b => b.asset_type === 'native');
          
          updateWalletUI(pk, 'manual');
          ultimaClaveSecreta = claveSecreta;
          localStorage.setItem('stellarSecret', claveSecreta);
          localStorage.setItem('stellarPublic', pk);
          
          stellarAccountInfo.textContent = `✅ Cuenta cargada\nPublic Key: ${pk}\nBalance: ${balance?.balance || '0'} XLM`;
        } catch (accountError) {
          // La cuenta puede no existir aún, pero la clave es válida
          updateWalletUI(pk, 'manual');
          ultimaClaveSecreta = claveSecreta;
          localStorage.setItem('stellarSecret', claveSecreta);
          localStorage.setItem('stellarPublic', pk);
          
          stellarAccountInfo.textContent = `✅ Clave válida\nPublic Key: ${pk}\n⚠️ La cuenta aún no existe en Testnet. Puedes financiarla después.`;
        }
      } catch (error) {
        stellarAccountInfo.textContent = `❌ Error: ${error.message}`;
        stellarAccountInfo.className = 'message error';
      }
    });

    // Validar campos en tiempo real
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('loginPassword');
    
    function validateLoginForm() {
      const hasUsername = usernameInput.value.trim().length > 0;
      const hasPassword = passwordInput.value.length > 0;
      loginBtn.disabled = !(hasUsername && hasPassword);
    }
    
    usernameInput.addEventListener('input', validateLoginForm);
    passwordInput.addEventListener('input', validateLoginForm);
    
    // Validar al cargar la página
    validateLoginForm();

    // Función para mostrar resultados
    function showResult(message, type = 'info') {
      result.textContent = message;
      result.classList.remove('hidden', 'success', 'error', 'info');
      result.classList.add('message', type);
    }

    // Manejo de imagen
    imageUploadDiv.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        imageUploadDiv.querySelector('p').textContent = `✓ ${file.name}`;
        imageUploadDiv.style.borderColor = 'var(--neon-cyan)';
        imageUploadDiv.style.background = 'rgba(0, 234, 255, 0.1)';
      }
    });
    imageUploadDiv.addEventListener('dragover', (event) => {
      event.preventDefault();
      imageUploadDiv.style.background = 'rgba(0, 234, 255, 0.15)';
    });
    imageUploadDiv.addEventListener('dragleave', () => {
      imageUploadDiv.style.background = 'transparent';
    });
    imageUploadDiv.addEventListener('drop', (event) => {
      event.preventDefault();
      imageUploadDiv.style.background = 'transparent';
      const file = event.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        fileInput.files = event.dataTransfer.files;
        imageUploadDiv.querySelector('p').textContent = `✓ ${file.name}`;
        imageUploadDiv.style.borderColor = 'var(--neon-cyan)';
        imageUploadDiv.style.background = 'rgba(0, 234, 255, 0.1)';
      }
    });

    // Cargar wallet guardada al iniciar
    window.addEventListener('load', () => {
      const publicKeyStored = localStorage.getItem('stellarPublic');
      if (publicKeyStored) {
        walletStatus.classList.remove('hidden');
        walletAddress.textContent = `Cuenta guardada: ${publicKeyStored.substring(0,10)}...${publicKeyStored.substring(publicKeyStored.length - 10)}`;
        publicKey = publicKeyStored;
        ultimaClavePublica = publicKeyStored;
      }
    });

    // Funciones de autenticación
    function buf2hex(buffer) {
      return Array.prototype.map.call(new Uint8Array(buffer), x => ('00' + x.toString(16)).slice(-2)).join('');
    }
    
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return buf2hex(hash);
    }
    
    function b64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }
    
    async function deriveKey(password, saltB64, iterations = 100000) {
      const saltBuf = b64ToArrayBuffer(saltB64);
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name: 'PBKDF2'}, false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        {name: 'PBKDF2', salt: saltBuf, iterations: iterations, hash: 'SHA-256'},
        keyMaterial,
        {name: 'AES-GCM', length: 256},
        false,
        ['encrypt','decrypt']
      );
    }
    
    async function decryptSecret(encryptedB64, saltB64, ivB64, password) {
      try {
        const key = await deriveKey(password, saltB64);
        const iv = new Uint8Array(b64ToArrayBuffer(ivB64));
        const cipherBuf = b64ToArrayBuffer(encryptedB64);
        const plainBuf = await crypto.subtle.decrypt({name: 'AES-GCM', iv: iv}, key, cipherBuf);
        const dec = new TextDecoder();
        return dec.decode(plainBuf);
      } catch (e) {
        throw new Error('No se pudo descifrar la clave secreta con la contraseña proporcionada.');
      }
    }
    
    function loadUsers() {
      try { return JSON.parse(localStorage.getItem('users') || '[]'); } catch (e) { return []; }
    }

    // Submit del login
    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      
      try {
        // Mostrar mensaje de carga
        showResult('Verificando credenciales...', 'info');
        console.log('=== INICIANDO PROCESO DE LOGIN ===');
        
        const usernameOrEmail = document.getElementById('username').value.trim();
        const passwordInputValue = document.getElementById('loginPassword').value;
        const imageFile = fileInput.files[0];

        // Validaciones básicas
        if (!usernameOrEmail) {
          showResult('Por favor, ingresa tu nombre de usuario o correo.', 'error');
          return;
        }
        
        if (!passwordInputValue) {
          showResult('Contraseña requerida para iniciar sesión.', 'error');
          return;
        }

        // Verificar si hay clave secreta manual ingresada
        const claveSecretaManual = claveSecretaManualInput.value.trim();
        if (claveSecretaManual && claveSecretaManual.startsWith('S')) {
          try {
            const pair = StellarSdk.Keypair.fromSecret(claveSecretaManual);
            const pk = pair.publicKey();
            ultimaClavePublica = pk;
            ultimaClaveSecreta = claveSecretaManual;
            connectedWallet = pk;
            publicKey = pk;
            localStorage.setItem('stellarSecret', claveSecretaManual);
            localStorage.setItem('stellarPublic', pk);
            console.log('Clave secreta manual procesada:', pk);
          } catch (e) {
            console.error('Error procesando clave secreta manual:', e);
            // Continuar con el login aunque falle la clave secreta
          }
        }

        const users = loadUsers();
        console.log('Usuarios encontrados:', users.length);
        
        const hashed = await hashPassword(passwordInputValue);
        console.log('Buscando usuario:', usernameOrEmail);
      
        let found = null;
        if (users.length > 0) {
          found = users.find(u => {
            const matchUsername = u.username && u.username.toLowerCase() === usernameOrEmail.toLowerCase();
            const matchEmail = u.email && u.email.toLowerCase() === usernameOrEmail.toLowerCase();
            const matchPassword = u.passwordHash === hashed;
            return (matchUsername || matchEmail) && matchPassword;
          });
        }
        
        // Si no se encuentra el usuario, crear uno automáticamente si hay clave Stellar configurada
        if (!found) {
          console.log('Usuario no encontrado. Usuarios disponibles:', users.map(u => u.username || 'sin nombre'));
          
          // Si el usuario tiene clave secreta configurada, crear cuenta automáticamente
          const stellarPublicKey = ultimaClavePublica || localStorage.getItem('stellarPublic');
          
          if (stellarPublicKey) {
            console.log('Clave Stellar detectada, creando usuario automáticamente...');
            
            // Crear usuario automáticamente
            const username = usernameOrEmail.includes('@') ? usernameOrEmail.split('@')[0] : usernameOrEmail;
            const email = usernameOrEmail.includes('@') ? usernameOrEmail : `${usernameOrEmail}@example.com`;
            
            const newUser = {
              username: username,
              email: email,
              passwordHash: hashed,
              role: 'estudiante',
              stellarPublic: stellarPublicKey,
              encryptedSecret: null,
              encSalt: null,
              encIv: null
            };
            
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            console.log('Usuario creado automáticamente:', newUser);
            
            found = newUser; // Usar el nuevo usuario como encontrado
          } else {
            // No hay clave Stellar, pedir registro
            showResult('Usuario no encontrado.\n\nPor favor, regístrate primero o conecta tu cuenta Stellar.', 'error');
            setTimeout(() => {
              if (confirm('¿Deseas ir a la página de registro?')) {
                window.location.href = 'Register.html';
              }
            }, 2000);
            return;
          }
        }

        console.log('Usuario encontrado:', found.username);

        // Guardar sesión
        const userData = {
          username: found.username,
          email: found.email,
          role: found.role || 'estudiante',
          stellarPublic: found.stellarPublic || ultimaClavePublica || localStorage.getItem('stellarPublic') || null
        };
        
        localStorage.setItem('currentUser', JSON.stringify(userData));
        console.log('Sesión guardada:', userData);

        // Descifrar clave secreta si existe
        if (found.encryptedSecret && found.encSalt && found.encIv) {
          try {
            const secret = await decryptSecret(found.encryptedSecret, found.encSalt, found.encIv, passwordInputValue);
            ultimaClaveSecreta = secret;
            ultimaClavePublica = found.stellarPublic || ultimaClavePublica;
            modoManual = true;
            connectedWallet = ultimaClavePublica;
            publicKey = ultimaClavePublica;
            localStorage.setItem('stellarSecret', secret);
            localStorage.setItem('stellarPublic', ultimaClavePublica);
            console.log('Clave secreta descifrada correctamente');
          } catch (decErr) {
            console.error('Error descifrando clave secreta:', decErr);
            // Continuar con el login aunque falle el descifrado
          }
        }

        // Actualizar stellarPublic en currentUser si tenemos una clave
        if (ultimaClavePublica) {
          const currentUserData = JSON.parse(localStorage.getItem('currentUser') || '{}');
          currentUserData.stellarPublic = ultimaClavePublica;
          localStorage.setItem('currentUser', JSON.stringify(currentUserData));
          localStorage.setItem('stellarPublic', ultimaClavePublica);
        }

        // Actualizar wallet-manager si está disponible
        if (typeof window.walletManager !== 'undefined' && ultimaClavePublica) {
          try {
            window.walletManager.publicKey = ultimaClavePublica;
            window.walletManager.saveToStorage();
          } catch (e) {
            console.warn('No se pudo actualizar wallet-manager:', e);
          }
        }

        // Redirigir después de un breve delay
        console.log('Preparando redirección a Inicio.html...');
        showResult(`✓ Autenticación exitosa para ${found.username}\nCuenta Stellar: ${connectedWallet || ultimaClavePublica || 'No configurada'}\n\nRedirigiendo...`, 'success');
        
        setTimeout(() => { 
          console.log('Redirigiendo a Inicio.html...');
          try {
            window.location.href = "Inicio.html";
          } catch (e) {
            console.error('Error en redirección con href:', e);
            try {
              window.location.replace("Inicio.html");
            } catch (e2) {
              console.error('Error en redirección con replace:', e2);
              // Último fallback
              window.open("Inicio.html", "_self");
            }
          }
        }, 1500);
      } catch (error) {
        console.error('Error completo en login:', error);
        console.error('Stack trace:', error.stack);
        showResult(`❌ Error: ${error.message}\n\nPor favor, intenta de nuevo o contacta al soporte.`, 'error');
      }
    });
    
    // También agregar listener al botón directamente como fallback
    loginBtn.addEventListener('click', function(e) {
      console.log('Botón de login clickeado directamente');
      // El submit del formulario debería manejar esto, pero esto es un fallback
    });
  </script>
</body>
</html>
