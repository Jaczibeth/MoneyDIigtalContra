<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Digital - Wallet y Recompensas | GROUP JAD</title>

    <!-- Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-dark: rgba(255, 255, 255, 0.06);
            --border-dark: rgba(255, 255, 255, 0.12);
            --neon-cyan: #00eaff;
            --neon-purple: #b400ff;
            --text-light: #e5e5e5;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* Glow Effect */
        .glow {
            text-shadow: 0 0 12px var(--neon-cyan), 0 0 24px var(--neon-purple);
        }

        /* Navigation */
        header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--border-dark);
            padding: 20px 40px;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: #bbb;
            padding: 10px 18px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: 500;
        }
        nav a:hover, nav a.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* Card */
        .card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            padding: 32px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.1);
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.2);
        }

        /* Inputs */
        .form-input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            color: white;
            transition: 0.3s;
        }
        .form-input:focus {
            outline: none;
            box-shadow: 0 0 12px var(--neon-purple);
            border-color: var(--neon-purple);
        }

        /* Buttons */
        .btn {
            padding: 14px 22px;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            box-shadow: 0 0 12px var(--neon-cyan);
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px var(--neon-purple);
        }
        .btn-send {
            background: linear-gradient(135deg, #ff00cc, #7700ff);
            box-shadow: 0 0 12px #c800ff;
        }

        /* Messages */
        .message {
            padding: 14px 16px;
            border-radius: 10px;
            margin-top: 14px;
            font-weight: 500;
        }
        .error {
            background: rgba(255, 0, 80, 0.2);
            color: #ff4d6d;
        }
        .success {
            background: rgba(0, 255, 200, 0.2);
            color: #00ffc8;
        }
        .message.success {
            background: rgba(0, 255, 200, 0.2);
            color: #00ffc8;
        }
        .message.error {
            background: rgba(255, 0, 80, 0.2);
            color: #ff4d6d;
        }

        .hidden { display: none !important; }

        /* Particles */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: -1;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(-40px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.2; }
        }

    </style>
</head>

<body>
    <div class="bg-particles"></div>

    <!-- NAV -->
    <header class="flex justify-between items-center">
        <h1 class="text-3xl font-bold glow">Money Digital - GROUP JAD</h1>

        <nav class="flex gap-6">
            <a href="Inicio.html">Inicio</a>
            <a href="Wallet.html" class="active">Wallet</a>
            <a href="Moneda.html">Moneda</a>
            <a href="Usuarios.html">Usuarios</a>
        </nav>
    </header>


    <!-- WALLET -->
    <div class="max-w-2xl mx-auto mt-12 px-6" id="wallet-container">

        <!-- LOGIN CARD -->
        <div id="login-section" class="card text-center">
            <h2 class="text-2xl font-bold glow mb-2">Conectar Wallet</h2>
            <p class="text-gray-300 mb-6">Conecta tu wallet Stellar para gestionar tus recompensas digitales</p>

            <!-- Freighter Wallet Option -->
            <div id="freighter-section" class="mb-6">
                <button id="connect-freighter-btn" class="btn btn-primary w-full mb-4">
                    🔐 Conectar con Freighter Wallet
                </button>
                <p id="freighter-status" class="text-sm text-gray-400 hidden"></p>
            </div>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-600"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-transparent text-gray-400">O</span>
                </div>
            </div>

            <!-- Manual Keypair Option -->
            <div class="mb-4">
                <label class="block text-gray-400 text-left mb-2">Conectar con Clave Secreta (Solo para desarrollo)</label>
                <input id="secret-key" type="password" class="form-input mb-4" placeholder="S..." />
                <button id="connect-manual-btn" class="btn btn-primary w-full">Conectar con Clave Secreta</button>
            </div>

            <div id="login-error" class="message error hidden"></div>
            <div id="login-success" class="message success hidden"></div>
        </div>

        <!-- WALLET VIEW -->
        <div id="wallet-section" class="card hidden">

            <h2 class="text-2xl font-bold glow mb-4">Tu Wallet</h2>

            <div class="mb-6">
                <p class="text-gray-400">Clave Pública</p>
                <div id="public-key" class="font-mono text-neon text-lg break-all"></div>
            </div>

            <div class="mb-6">
                <p class="text-gray-400">Balance</p>
                <div id="balance" class="text-xl glow">Cargando...</div>
            </div>

            <button id="refresh-balance-btn" class="btn btn-primary w-full mb-6">Actualizar Balance</button>

            <!-- SEND PANEL -->
            <div class="p-5 rounded-xl border border-gray-700 bg-black bg-opacity-40">
                <h3 class="text-xl glow text-center mb-4">Enviar XLM</h3>

                <label class="block text-gray-400 mb-2">Cuenta Destino</label>
                <input id="destination" type="text" class="form-input mb-4" placeholder="G..." />

                <label class="block text-gray-400 mb-2">Cantidad</label>
                <input id="amount" type="number" class="form-input mb-4" placeholder="10" />

                <button id="send-btn" class="btn btn-send w-full">Enviar</button>

                <div id="send-error" class="message error hidden"></div>
                <div id="send-success" class="message success hidden"></div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-16 py-6 text-gray-500">
        Built with Stellar Testnet
    </footer>


    <!-- STELLAR SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.2.2/stellar-sdk.min.js"></script>
    <!-- Freighter API -->
    <script src="https://unpkg.com/@stellar/freighter-api@4.1.0/dist/freighter-api.min.js"></script>

    <script>
        /* PARTICLES */
        function createParticles() {
            const container = document.querySelector(".bg-particles");
            for (let i = 0; i < 60; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.left = Math.random() * 100 + "%";
                p.style.top = Math.random() * 100 + "%";
                p.style.animationDelay = Math.random() * 6 + "s";
                container.appendChild(p);
            }
        }
        createParticles();

        /* WALLET LOGIC */
        (() => {
            const SecretKeyInput = document.getElementById('secret-key');
            const ConnectFreighterBtn = document.getElementById('connect-freighter-btn');
            const ConnectManualBtn = document.getElementById('connect-manual-btn');
            const FreighterStatus = document.getElementById('freighter-status');
            const LoginError = document.getElementById('login-error');
            const LoginSuccess = document.getElementById('login-success');

            const WalletSection = document.getElementById('wallet-section');
            const LoginSection = document.getElementById('login-section');

            const PublicKeyDisplay = document.getElementById('public-key');
            const BalanceDisplay = document.getElementById('balance');
            const RefreshBalanceBtn = document.getElementById('refresh-balance-btn');

            const DestinationInput = document.getElementById('destination');
            const AmountInput = document.getElementById('amount');
            const SendBtn = document.getElementById('send-btn');
            const SendError = document.getElementById('send-error');
            const SendSuccess = document.getElementById('send-success');

            const server = new StellarSdk.Server('https://horizon-testnet.stellar.org');
            const networkPassphrase = StellarSdk.Networks.TESTNET;

            let keypair = null;
            let publicKey = null;
            let usingFreighter = false;

            // Verificar si Freighter está disponible
            function isFreighterAvailable() {
                return typeof window.freighterApi !== 'undefined';
            }

            // Conectar con Freighter Wallet
            async function connectWithFreighter() {
                if (!isFreighterAvailable()) {
                    FreighterStatus.textContent = "⚠️ Freighter Wallet no está instalado. Descárgalo desde https://freighter.app/";
                    FreighterStatus.classList.remove("hidden");
                    FreighterStatus.classList.add("error");
                    return false;
                }

                try {
                    FreighterStatus.textContent = "Conectando con Freighter...";
                    FreighterStatus.classList.remove("hidden");
                    FreighterStatus.classList.remove("error", "success");
                    
                    // Verificar permisos
                    const isAllowed = await window.freighterApi.isAllowed();
                    if (!isAllowed) {
                        await window.freighterApi.setAllowed();
                    }

                    // Obtener clave pública
                    publicKey = await window.freighterApi.getPublicKey();
                    usingFreighter = true;
                    keypair = null; // No almacenamos keypair cuando usamos Freighter

                    PublicKeyDisplay.textContent = publicKey;
                    LoginSection.classList.add("hidden");
                    WalletSection.classList.remove("hidden");
                    
                    FreighterStatus.textContent = "✓ Conectado con Freighter";
                    FreighterStatus.classList.add("success");
                    
                    loadAccountBalance(publicKey);
                    return true;
                } catch (error) {
                    console.error('Error conectando Freighter:', error);
                    FreighterStatus.textContent = "❌ Error: " + error.message;
                    FreighterStatus.classList.add("error");
                    return false;
                }
            }

            function validateSecretKey(key) {
                try { return StellarSdk.Keypair.fromSecret(key); }
                catch { return null; }
            }

            async function loadAccountBalance(pk) {
                try {
                    const account = await server.loadAccount(pk);
                    const bal = account.balances.find(b => b.asset_type === "native");
                    BalanceDisplay.textContent = bal ? bal.balance + " XLM" : "0 XLM";
                } catch (error) {
                    if (error.response && error.response.status === 404) {
                        BalanceDisplay.textContent = "Cuenta no encontrada. Financia tu cuenta con friendbot.";
                    } else {
                        BalanceDisplay.textContent = "Error al cargar balance: " + error.message;
                    }
                }
            }

            // Verificar Freighter y cargar wallet del usuario al cargar la página
            window.addEventListener('DOMContentLoaded', async () => {
                if (!isFreighterAvailable()) {
                    FreighterStatus.textContent = "⚠️ Freighter Wallet no detectado. Instálalo para una conexión más segura.";
                    FreighterStatus.classList.remove("hidden");
                }
                
                // Intentar cargar wallet del usuario actual si existe
                try {
                    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                    const storedPublicKey = currentUser.stellarPublic || localStorage.getItem('stellarPublic');
                    
                    if (storedPublicKey) {
                        // Si hay una wallet guardada, intentar conectarla automáticamente
                        // Primero intentar con Freighter si está disponible
                        if (isFreighterAvailable()) {
                            try {
                                const isAllowed = await window.freighterApi.isAllowed();
                                if (isAllowed) {
                                    const freighterPublic = await window.freighterApi.getPublicKey();
                                    if (freighterPublic === storedPublicKey) {
                                        // La wallet de Freighter coincide con la guardada
                                        publicKey = freighterPublic;
                                        usingFreighter = true;
                                        PublicKeyDisplay.textContent = publicKey;
                                        LoginSection.classList.add("hidden");
                                        WalletSection.classList.remove("hidden");
                                        loadAccountBalance(publicKey);
                                        return;
                                    }
                                }
                            } catch (e) {
                                console.warn('No se pudo conectar con Freighter automáticamente:', e);
                            }
                        }
                        
                        // Si no se puede conectar con Freighter, mostrar la wallet guardada pero requerir conexión manual
                        // (No conectamos automáticamente con clave secreta por seguridad)
                        PublicKeyDisplay.textContent = storedPublicKey;
                        LoginSection.querySelector('p').textContent = `Wallet guardada: ${storedPublicKey.substring(0, 10)}...${storedPublicKey.substring(storedPublicKey.length - 10)}. Conecta para gestionarla.`;
                    }
                } catch (e) {
                    console.warn('Error cargando wallet del usuario:', e);
                }
            });

            /* CONECTAR CON FREIGHTER */
            ConnectFreighterBtn.addEventListener("click", async () => {
                LoginError.classList.add("hidden");
                LoginSuccess.classList.add("hidden");
                await connectWithFreighter();
            });

            /* CONECTAR CON CLAVE SECRETA (MANUAL) */
            ConnectManualBtn.addEventListener("click", async () => {
                const secret = SecretKeyInput.value.trim();
                LoginError.classList.add("hidden");
                LoginSuccess.classList.add("hidden");

                if (!secret) {
                    LoginError.textContent = "Por favor, ingresa tu clave secreta.";
                    LoginError.classList.remove("hidden");
                    return;
                }

                const validKey = validateSecretKey(secret);
                if (!validKey) {
                    LoginError.textContent = "Clave secreta inválida. Debe comenzar con 'S'.";
                    LoginError.classList.remove("hidden");
                    return;
                }

                keypair = validKey;
                publicKey = keypair.publicKey();
                usingFreighter = false;

                PublicKeyDisplay.textContent = publicKey;
                LoginSection.classList.add("hidden");
                WalletSection.classList.remove("hidden");

                LoginSuccess.textContent = "✓ Wallet conectada correctamente";
                LoginSuccess.classList.remove("hidden");

                loadAccountBalance(publicKey);
            });

            /* BALANCE REFRESH */
            RefreshBalanceBtn.addEventListener("click", () => {
                if (publicKey) loadAccountBalance(publicKey);
            });

            /* SEND PAYMENT */
            SendBtn.addEventListener("click", async () => {
                SendError.classList.add("hidden");
                SendSuccess.classList.add("hidden");

                if (!publicKey) {
                    SendError.textContent = "No hay wallet conectada.";
                    SendError.classList.remove("hidden");
                    return;
                }

                const dest = DestinationInput.value.trim();
                const amount = AmountInput.value.trim();

                if (!StellarSdk.StrKey.isValidEd25519PublicKey(dest)) {
                    SendError.textContent = "Cuenta destino inválida.";
                    SendError.classList.remove("hidden");
                    return;
                }
                if (Number(amount) <= 0) {
                    SendError.textContent = "Cantidad inválida.";
                    SendError.classList.remove("hidden");
                    return;
                }

                try {
                    const acc = await server.loadAccount(publicKey);
                    const fee = await server.fetchBaseFee();

                    const tx = new StellarSdk.TransactionBuilder(acc, {
                        fee,
                        networkPassphrase: networkPassphrase
                    })
                    .addOperation(StellarSdk.Operation.payment({
                        destination: dest,
                        asset: StellarSdk.Asset.native(),
                        amount: amount
                    }))
                    .setTimeout(30)
                    .build();

                    // Firmar transacción según el método de conexión
                    if (usingFreighter && isFreighterAvailable()) {
                        // Firmar con Freighter
                        const signedXdr = await window.freighterApi.signTransaction(tx.toXDR(), {
                            network: networkPassphrase,
                            accountToSign: publicKey
                        });
                        const txFromXdr = StellarSdk.TransactionBuilder.fromXDR(signedXdr, networkPassphrase);
                        const res = await server.submitTransaction(txFromXdr);
                        
                        SendSuccess.textContent = "✓ Transacción exitosa! Hash: " + res.hash;
                        SendSuccess.classList.remove("hidden");
                    } else if (keypair) {
                        // Firmar con clave secreta (solo para desarrollo)
                        tx.sign(keypair);
                        const res = await server.submitTransaction(tx);
                        
                        SendSuccess.textContent = "✓ Transacción exitosa! Hash: " + res.hash;
                        SendSuccess.classList.remove("hidden");
                    } else {
                        throw new Error("No se puede firmar la transacción");
                    }

                    DestinationInput.value = "";
                    AmountInput.value = "";
                    loadAccountBalance(publicKey);
                } catch (e) {
                    console.error('Error en transacción:', e);
                    SendError.textContent = "Error: " + (e.message || "No se pudo completar la transacción");
                    SendError.classList.remove("hidden");
                }
            });

        })();
    </script>

</body>
</html>
