<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Money Digital - Wallet y Recompensas | GROUP JAD</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/modern-theme.css">

    <style>
        /* Particles */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            opacity: 0.4;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: float 6s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(-40px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="bg-particles"></div>

    <!-- NAV -->
    <header class="flex justify-between items-center">
        <h1 class="text-3xl font-bold glow">Money Digital - GROUP JAD</h1>
        <nav class="flex gap-6">
            <a href="Inicio.html">🏠 Inicio</a>
            <a href="Wallet.html" class="active">💎 Wallet</a>
            <a href="Moneda.html">🪙 Moneda</a>
            <a href="Usuarios.html">👥 Usuarios</a>
        </nav>
    </header>

    <!-- WALLET -->
    <div class="max-w-2xl mx-auto mt-12 px-6" id="wallet-container">
        <!-- LOGIN CARD -->
        <div id="login-section" class="glass-card text-center">
            <h2 class="text-2xl font-bold glow mb-2">Conectar Wallet</h2>
            <p class="text-text-soft mb-6">Conecta tu wallet Stellar para gestionar tus recompensas digitales</p>

            <!-- Opción rápida: usar claves del usuario -->
            <button id="usar-claves-usuario" class="btn btn-primary w-full mb-4">
                🔑 Usar mis claves (Recomendado)
            </button>

            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t" style="border-color: var(--border-color);"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4" style="background: var(--bg-card); color: var(--text-muted);">O</span>
                </div>
            </div>

            <!-- Freighter Wallet Option -->
            <div id="freighter-section" class="mb-6">
                <button id="connect-freighter-btn" class="btn btn-secondary w-full mb-4">
                    🔐 Conectar con Freighter Wallet
                </button>
                <p id="freighter-status" class="text-sm message hidden"></p>
            </div>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t" style="border-color: var(--border-color);"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4" style="background: var(--bg-card); color: var(--text-muted);">O usar clave manual</span>
                </div>
            </div>

            <!-- Manual Keypair Option -->
            <div class="mb-4">
                <label class="block text-text-soft text-left mb-2">Conectar con Clave Secreta</label>
                <input id="secret-key" type="password" class="form-input mb-4" placeholder="S..." />
                <button id="connect-manual-btn" class="btn btn-primary w-full">Conectar con Clave Secreta</button>
            </div>

            <div id="login-error" class="message error hidden"></div>
            <div id="login-success" class="message success hidden"></div>
        </div>

        <!-- WALLET VIEW -->
        <div id="wallet-section" class="glass-card hidden">
            <h2 class="text-2xl font-bold glow mb-4">Tu Wallet</h2>

            <div class="mb-6">
                <p class="text-text-soft mb-2">Clave Pública</p>
                <div id="public-key" class="font-mono text-neon-cyan text-lg break-all p-3 rounded" style="background: rgba(0, 234, 255, 0.1);"></div>
            </div>

            <div class="mb-6">
                <p class="text-text-soft mb-2">Balance</p>
                <div id="balance" class="text-3xl glow font-bold">Cargando...</div>
            </div>

            <button id="refresh-balance-btn" class="btn btn-primary w-full mb-6">🔄 Actualizar Balance</button>
            
            <button id="fund-account-btn" class="btn btn-secondary w-full mb-6">💰 Financiar Cuenta (Friendbot)</button>

            <!-- SEND PANEL -->
            <div class="glass-card" style="background: rgba(0, 234, 255, 0.05); border-color: rgba(0, 234, 255, 0.3);">
                <h3 class="text-xl glow text-center mb-4">Enviar XLM</h3>

                <label class="block text-text-soft mb-2">Cuenta Destino</label>
                <input id="destination" type="text" class="form-input mb-4" placeholder="G..." />

                <label class="block text-text-soft mb-2">Cantidad</label>
                <input id="amount" type="number" step="0.0000001" class="form-input mb-4" placeholder="10" />

                <button id="send-btn" class="btn btn-danger w-full">Enviar</button>

                <div id="send-error" class="message error hidden mt-4"></div>
                <div id="send-success" class="message success hidden mt-4"></div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-16 py-6 text-text-muted">
        Built with Stellar Testnet | Money Digital - GROUP JAD
    </footer>

    <!-- STELLAR SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.2.2/stellar-sdk.min.js"></script>
    <!-- Freighter API -->
    <script src="https://unpkg.com/@stellar/freighter-api@4.1.0/dist/freighter-api.min.js"></script>
    <!-- Wallet Manager -->
    <script src="js/wallet-manager.js"></script>

    <script>
        // Claves del usuario por defecto
        const USER_SECRET_KEY = 'SD4ZN2WZKRGHJXKOA4TZ3LDW4JY43LT6RU4YSD6PVJ7IRMLDW4EPOPET';
        const USER_PUBLIC_KEY = 'GAX6QLY4HV23XBE3E7WBMUXKJ3Y7BS6CWF6JBE7U5TEOFEK5P6H2QYYD';

        /* PARTICLES */
        function createParticles() {
            const container = document.querySelector(".bg-particles");
            if (!container) return;
            for (let i = 0; i < 60; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.left = Math.random() * 100 + "%";
                p.style.top = Math.random() * 100 + "%";
                p.style.animationDelay = Math.random() * 6 + "s";
                container.appendChild(p);
            }
        }
        createParticles();

        /* WALLET LOGIC */
        (() => {
            const SecretKeyInput = document.getElementById('secret-key');
            const ConnectFreighterBtn = document.getElementById('connect-freighter-btn');
            const ConnectManualBtn = document.getElementById('connect-manual-btn');
            const UsarClavesUsuarioBtn = document.getElementById('usar-claves-usuario');
            const FreighterStatus = document.getElementById('freighter-status');
            const LoginError = document.getElementById('login-error');
            const LoginSuccess = document.getElementById('login-success');

            const WalletSection = document.getElementById('wallet-section');
            const LoginSection = document.getElementById('login-section');

            const PublicKeyDisplay = document.getElementById('public-key');
            const BalanceDisplay = document.getElementById('balance');
            const RefreshBalanceBtn = document.getElementById('refresh-balance-btn');
            const FundAccountBtn = document.getElementById('fund-account-btn');

            const DestinationInput = document.getElementById('destination');
            const AmountInput = document.getElementById('amount');
            const SendBtn = document.getElementById('send-btn');
            const SendError = document.getElementById('send-error');
            const SendSuccess = document.getElementById('send-success');

            let publicKey = null;
            let usingFreighter = false;

            // Usar claves del usuario
            UsarClavesUsuarioBtn.addEventListener('click', async () => {
                LoginError.classList.add('hidden');
                LoginSuccess.classList.add('hidden');
                FreighterStatus.classList.add('hidden');

                try {
                    if (typeof window.walletManager !== 'undefined') {
                        const result = await window.walletManager.connectWithSecretKey(USER_SECRET_KEY);
                        publicKey = result.publicKey;
                        usingFreighter = false;
                        
                        PublicKeyDisplay.textContent = publicKey;
                        LoginSection.classList.add('hidden');
                        WalletSection.classList.remove('hidden');
                        
                        LoginSuccess.textContent = '✓ Wallet conectada con tus claves';
                        LoginSuccess.classList.remove('hidden');
                        
                        await loadAccountBalance(publicKey);
                    } else {
                        throw new Error('Wallet manager no disponible');
                    }
                } catch (error) {
                    LoginError.textContent = `Error: ${error.message}`;
                    LoginError.classList.remove('hidden');
                }
            });

            // Conectar con Freighter Wallet
            async function connectWithFreighter() {
                if (typeof window.walletManager !== 'undefined') {
                    try {
                        const result = await window.walletManager.connectWithFreighter();
                        publicKey = result.publicKey;
                        usingFreighter = true;
                        
                        PublicKeyDisplay.textContent = publicKey;
                        LoginSection.classList.add('hidden');
                        WalletSection.classList.remove('hidden');
                        
                        FreighterStatus.textContent = '✓ Conectado con Freighter';
                        FreighterStatus.classList.remove('hidden');
                        FreighterStatus.classList.add('message', 'success');
                        
                        await loadAccountBalance(publicKey);
                        return true;
                    } catch (error) {
                        FreighterStatus.textContent = `❌ Error: ${error.message}`;
                        FreighterStatus.classList.remove('hidden');
                        FreighterStatus.classList.add('message', 'error');
                        return false;
                    }
                } else {
                    // Fallback sin wallet-manager
                    if (typeof window.freighterApi === 'undefined') {
                        FreighterStatus.textContent = '⚠️ Freighter Wallet no está instalado';
                        FreighterStatus.classList.remove('hidden');
                        FreighterStatus.classList.add('message', 'error');
                        return false;
                    }

                    try {
                        const isAllowed = await window.freighterApi.isAllowed();
                        if (!isAllowed) {
                            await window.freighterApi.setAllowed();
                        }

                        publicKey = await window.freighterApi.getPublicKey();
                        usingFreighter = true;

                        PublicKeyDisplay.textContent = publicKey;
                        LoginSection.classList.add('hidden');
                        WalletSection.classList.remove('hidden');
                        
                        FreighterStatus.textContent = '✓ Conectado con Freighter';
                        FreighterStatus.classList.remove('hidden');
                        FreighterStatus.classList.add('message', 'success');
                        
                        await loadAccountBalance(publicKey);
                        return true;
                    } catch (error) {
                        FreighterStatus.textContent = `❌ Error: ${error.message}`;
                        FreighterStatus.classList.remove('hidden');
                        FreighterStatus.classList.add('message', 'error');
                        return false;
                    }
                }
            }

            // Conectar con clave secreta manual
            async function connectWithSecretKey(secretKey) {
                try {
                    if (typeof window.walletManager !== 'undefined') {
                        const result = await window.walletManager.connectWithSecretKey(secretKey);
                        publicKey = result.publicKey;
                        usingFreighter = false;
                        
                        PublicKeyDisplay.textContent = publicKey;
                        LoginSection.classList.add('hidden');
                        WalletSection.classList.remove('hidden');
                        
                        LoginSuccess.textContent = '✓ Wallet conectada correctamente';
                        LoginSuccess.classList.remove('hidden');
                        
                        await loadAccountBalance(publicKey);
                        return true;
                    } else {
                        // Fallback
                        const keypair = StellarSdk.Keypair.fromSecret(secretKey);
                        publicKey = keypair.publicKey();
                        usingFreighter = false;
                        
                        PublicKeyDisplay.textContent = publicKey;
                        LoginSection.classList.add('hidden');
                        WalletSection.classList.remove('hidden');
                        
                        LoginSuccess.textContent = '✓ Wallet conectada correctamente';
                        LoginSuccess.classList.remove('hidden');
                        
                        await loadAccountBalance(publicKey);
                        return true;
                    }
                } catch (error) {
                    LoginError.textContent = `Error: ${error.message}`;
                    LoginError.classList.remove('hidden');
                    return false;
                }
            }

            async function loadAccountBalance(pk) {
                try {
                    if (typeof window.walletManager !== 'undefined') {
                        const balance = await window.walletManager.getBalance(pk);
                        BalanceDisplay.textContent = balance.formatted;
                    } else {
                        const server = new StellarSdk.Server('https://horizon-testnet.stellar.org');
                        const account = await server.loadAccount(pk);
                        const bal = account.balances.find(b => b.asset_type === 'native');
                        BalanceDisplay.textContent = bal ? bal.balance + ' XLM' : '0 XLM';
                    }
                } catch (error) {
                    if (error.response && error.response.status === 404) {
                        BalanceDisplay.textContent = 'Cuenta no encontrada. Financia tu cuenta con friendbot.';
                    } else {
                        BalanceDisplay.textContent = 'Error al cargar balance: ' + error.message;
                    }
                }
            }

            // Cargar wallet guardada al iniciar
            window.addEventListener('DOMContentLoaded', async () => {
                // Intentar cargar wallet del usuario actual
                try {
                    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                    const storedPublicKey = currentUser.stellarPublic || localStorage.getItem('stellarPublic');
                    
                    if (storedPublicKey) {
                        // Intentar conectar automáticamente con Freighter si está disponible
                        if (typeof window.freighterApi !== 'undefined') {
                            try {
                                const isAllowed = await window.freighterApi.isAllowed();
                                if (isAllowed) {
                                    const freighterPublic = await window.freighterApi.getPublicKey();
                                    if (freighterPublic === storedPublicKey) {
                                        publicKey = freighterPublic;
                                        usingFreighter = true;
                                        PublicKeyDisplay.textContent = publicKey;
                                        LoginSection.classList.add('hidden');
                                        WalletSection.classList.remove('hidden');
                                        await loadAccountBalance(publicKey);
                                        return;
                                    }
                                }
                            } catch (e) {
                                console.warn('No se pudo conectar con Freighter automáticamente:', e);
                            }
                        }
                        
                        // Mostrar wallet guardada pero requerir conexión
                        PublicKeyDisplay.textContent = storedPublicKey;
                        LoginSection.querySelector('p').textContent = `Wallet guardada: ${storedPublicKey.substring(0, 10)}...${storedPublicKey.substring(storedPublicKey.length - 10)}. Conecta para gestionarla.`;
                    }
                } catch (e) {
                    console.warn('Error cargando wallet del usuario:', e);
                }
            });

            /* EVENT LISTENERS */
            ConnectFreighterBtn.addEventListener('click', async () => {
                LoginError.classList.add('hidden');
                LoginSuccess.classList.add('hidden');
                await connectWithFreighter();
            });

            ConnectManualBtn.addEventListener('click', async () => {
                const secret = SecretKeyInput.value.trim();
                LoginError.classList.add('hidden');
                LoginSuccess.classList.add('hidden');

                if (!secret) {
                    LoginError.textContent = 'Por favor, ingresa tu clave secreta.';
                    LoginError.classList.remove('hidden');
                    return;
                }

                await connectWithSecretKey(secret);
            });

            RefreshBalanceBtn.addEventListener('click', () => {
                if (publicKey) loadAccountBalance(publicKey);
            });

            FundAccountBtn.addEventListener('click', async () => {
                if (!publicKey) {
                    alert('No hay wallet conectada');
                    return;
                }
                
                try {
                    if (typeof window.walletManager !== 'undefined') {
                        FundAccountBtn.disabled = true;
                        FundAccountBtn.textContent = 'Financiando...';
                        await window.walletManager.fundAccount(publicKey);
                        FundAccountBtn.textContent = '💰 Financiar Cuenta (Friendbot)';
                        FundAccountBtn.disabled = false;
                        await loadAccountBalance(publicKey);
                        alert('Cuenta financiada exitosamente');
                    } else {
                        const response = await fetch(`https://friendbot.stellar.org?addr=${encodeURIComponent(publicKey)}`);
                        const json = await response.json();
                        await new Promise(r => setTimeout(r, 2000));
                        await loadAccountBalance(publicKey);
                        alert('Cuenta financiada exitosamente');
                    }
                } catch (error) {
                    alert(`Error financiando cuenta: ${error.message}`);
                }
            });

            SendBtn.addEventListener('click', async () => {
                SendError.classList.add('hidden');
                SendSuccess.classList.add('hidden');

                if (!publicKey) {
                    SendError.textContent = 'No hay wallet conectada.';
                    SendError.classList.remove('hidden');
                    return;
                }

                const dest = DestinationInput.value.trim();
                const amount = AmountInput.value.trim();

                if (!StellarSdk.StrKey.isValidEd25519PublicKey(dest)) {
                    SendError.textContent = 'Cuenta destino inválida.';
                    SendError.classList.remove('hidden');
                    return;
                }
                if (Number(amount) <= 0) {
                    SendError.textContent = 'Cantidad inválida.';
                    SendError.classList.remove('hidden');
                    return;
                }

                try {
                    if (typeof window.walletManager !== 'undefined') {
                        const result = await window.walletManager.sendPayment(dest, amount);
                        SendSuccess.textContent = `✓ Transacción exitosa! Hash: ${result.hash}`;
                        SendSuccess.classList.remove('hidden');
                    } else {
                        // Fallback sin wallet-manager
                        const server = new StellarSdk.Server('https://horizon-testnet.stellar.org');
                        const acc = await server.loadAccount(publicKey);
                        const fee = await server.fetchBaseFee();

                        const tx = new StellarSdk.TransactionBuilder(acc, {
                            fee,
                            networkPassphrase: StellarSdk.Networks.TESTNET
                        })
                        .addOperation(StellarSdk.Operation.payment({
                            destination: dest,
                            asset: StellarSdk.Asset.native(),
                            amount: amount
                        }))
                        .setTimeout(30)
                        .build();

                        if (usingFreighter && typeof window.freighterApi !== 'undefined') {
                            const signedXdr = await window.freighterApi.signTransaction(tx.toXDR(), {
                                network: StellarSdk.Networks.TESTNET,
                                accountToSign: publicKey
                            });
                            const txFromXdr = StellarSdk.TransactionBuilder.fromXDR(signedXdr, StellarSdk.Networks.TESTNET);
                            const res = await server.submitTransaction(txFromXdr);
                            SendSuccess.textContent = `✓ Transacción exitosa! Hash: ${res.hash}`;
                            SendSuccess.classList.remove('hidden');
                        } else {
                            throw new Error('No se puede firmar la transacción');
                        }
                    }

                    DestinationInput.value = '';
                    AmountInput.value = '';
                    await loadAccountBalance(publicKey);
                } catch (e) {
                    console.error('Error en transacción:', e);
                    SendError.textContent = 'Error: ' + (e.message || 'No se pudo completar la transacción');
                    SendError.classList.remove('hidden');
                }
            });
        })();
    </script>
</body>
</html>
