<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Registro - Money Digital | GROUP JAD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Stellar SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.2.2/stellar-sdk.min.js"></script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }

    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-dark {
      background: #1E1E1E;
      border: 1px solid #333;
      color: white;
    }

    .input-dark:focus {
      border-color: #6A5ACD;
      outline: none;
      box-shadow: 0 0 6px #6A5ACD;
    }

    .btn-primary {
      background: linear-gradient(to right, #6A5ACD, #00E5FF);
      transition: 0.25s;
    }

    .btn-primary:hover {
      filter: brightness(1.2);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }
  </style>
</head>

<body class="min-h-screen bg-black flex items-center justify-center p-4">

  <div class="max-w-md w-full p-8 rounded-xl glass shadow-xl text-white">
    <h1
      class="text-3xl font-bold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">
      Money Digital
    </h1>
    <p class="text-center text-gray-400 text-sm mb-6">Dinero Inteligente, Futuro Brillante</p>
    <h2
      class="text-2xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">
      Crear una Cuenta
    </h2>

    <form id="registerForm" class="space-y-5">

      <div>
        <label class="text-gray-300 text-sm">Nombre de usuario</label>
        <input id="r_username" name="username" type="text" required class="w-full input-dark p-3 rounded-lg" placeholder="Tu usuario" autocomplete="username">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Correo electrónico</label>
        <input id="r_email" name="email" type="email" required class="w-full input-dark p-3 rounded-lg"
          placeholder="correo@ejemplo.com" autocomplete="email">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Contraseña</label>
        <input id="r_password" name="new-password" type="password" required class="w-full input-dark p-3 rounded-lg"
          placeholder="Contraseña" autocomplete="new-password">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Confirmar contraseña</label>
        <input id="r_password2" name="new-password-confirm" type="password" required class="w-full input-dark p-3 rounded-lg"
          placeholder="Repite la contraseña" autocomplete="new-password">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Tipo de usuario</label>
        <select id="r_role" required class="w-full input-dark p-3 rounded-lg">
          <option value="estudiante">Estudiante</option>
          <option value="docente">Docente</option>
        </select>
        <p class="text-gray-500 text-xs mt-1">Selecciona si eres estudiante o docente</p>
      </div>

      <!-- Sección para crear cuenta Stellar (Obligatoria) -->
      <div class="mt-6 p-4 bg-gray-800 rounded-lg border border-gray-700">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="createStellarAccount" class="mr-2" checked disabled>
          <span class="text-gray-300 text-sm">Crear cuenta Stellar automáticamente (Obligatorio)</span>
        </label>
        <p class="text-gray-500 text-xs mt-2">Se creará una cuenta Stellar Testnet y se financiará automáticamente para
          que puedas usar la plataforma.</p>
      </div>

      <div class="flex justify-between items-center mt-4">
        <a href="index.html" class="text-cyan-400 hover:underline text-sm">¿Ya tienes cuenta? Inicia sesión</a>

        <button type="submit" class="btn-primary px-5 py-2 rounded-lg font-semibold text-black">
          Registrarse
        </button>
      </div>
    </form>

    <div id="message" class="mt-4 text-sm p-3 rounded-lg"></div>
  </div>

  <script src="js/api-client.js"></script>
  <script>
    function arrayBufferToB64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    async function encryptSecret(secret, password) {
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt']
        );
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(secret));
        return { encrypted: arrayBufferToB64(encrypted), salt: arrayBufferToB64(salt), iv: arrayBufferToB64(iv) };
      } catch (e) {
        console.error('Error cifrando secreto:', e);
        throw new Error('No se pudo cifrar la clave secreta');
      }
    }

    async function createAndFundStellarAccount() {
      try {
        const StellarSdk = window.StellarSdk;
        if (!StellarSdk) throw new Error('Stellar SDK no está cargado');
        const pair = StellarSdk.Keypair.random();
        const publicKey = pair.publicKey();
        const secretKey = pair.secret();
        await fetch(`https://friendbot.stellar.org?addr=${encodeURIComponent(publicKey)}`);
        await new Promise(resolve => setTimeout(resolve, 2000));
        return { publicKey, secretKey, funded: true };
      } catch (error) {
        console.error('Error creando cuenta Stellar:', error);
        throw error;
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const messageDiv = document.getElementById('message');
      messageDiv.className = 'mt-4 text-sm p-3 rounded-lg';
      messageDiv.textContent = '';

      const username = document.getElementById('r_username').value.trim();
      const email = document.getElementById('r_email').value.trim();
      const password = document.getElementById('r_password').value;
      const password2 = document.getElementById('r_password2').value;

      if (!username || username.length < 3) {
        messageDiv.textContent = '❌ El nombre de usuario debe tener al menos 3 caracteres';
        messageDiv.className += ' bg-red-900 text-red-200'; return;
      }
      if (!email || !email.includes('@')) {
        messageDiv.textContent = '❌ Ingresa un correo electrónico válido';
        messageDiv.className += ' bg-red-900 text-red-200'; return;
      }
      if (!password || password.length < 6) {
        messageDiv.textContent = '❌ La contraseña debe tener al menos 6 caracteres';
        messageDiv.className += ' bg-red-900 text-red-200'; return;
      }
      if (password !== password2) {
        messageDiv.textContent = '❌ Las contraseñas no coinciden';
        messageDiv.className += ' bg-red-900 text-red-200'; return;
      }

      messageDiv.textContent = '⏳ Registrando usuario...';
      messageDiv.className += ' bg-blue-900 text-blue-200';

      try {
        const role = document.getElementById('r_role').value;
        let stellarPublic = null;
        let stellarSecret = null;

        try {
          messageDiv.textContent = '⏳ Creando cuenta Stellar...';
          const stellarAccount = await createAndFundStellarAccount();
          stellarPublic = stellarAccount.publicKey;
          stellarSecret = stellarAccount.secretKey;
        } catch (stellarError) {
          console.warn('No se pudo crear cuenta Stellar:', stellarError);
        }

        // Cifrar clave secreta con la contraseña antes de enviarla
        let stellarSecretEncrypted = null;
        let stellarPublicToSend = stellarPublic;

        if (stellarSecret && password) {
          try {
            const encrypted = await encryptSecret(stellarSecret, password);
            stellarSecretEncrypted = JSON.stringify(encrypted);
          } catch (encError) {
            console.warn('Error cifrando clave secreta:', encError);
          }
        }

        // NUNCA almacenar la clave secreta en texto plano en localStorage
        // La única copia persistente debe estar cifrada en el servidor
        try {
          localStorage.setItem('wallet_public_' + username, stellarPublic);
        } catch (e) {}

        // Intentar registro por API backend (PRINCIPAL)
        const result = await apiClient.register({
          username, email, password, role,
          stellarPublic: stellarPublicToSend || undefined,
          stellarSecretEncrypted: stellarSecretEncrypted || undefined
        });

        if (result.token) {
          apiClient.setToken(result.token);
          messageDiv.textContent = '✅ Usuario registrado exitosamente en el servidor! Redirigiendo...';
          messageDiv.className = 'mt-4 text-sm p-3 rounded-lg bg-green-900 text-green-200';
          setTimeout(() => window.location.href = 'index.html', 1500);
          return;
        }

        throw new Error('El servidor no devolvió un token de autenticación.');
      } catch (error) {
        messageDiv.textContent = '❌ Error al registrar: ' + error.message;
        messageDiv.className += ' bg-red-900 text-red-200';
      }
    });
  </script>

</body>

</html>
