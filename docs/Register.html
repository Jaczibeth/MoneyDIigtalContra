<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Registro - Money Digital | GROUP JAD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Stellar SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.2.2/stellar-sdk.min.js"></script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }

    .glass {
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-dark {
      background: #1E1E1E;
      border: 1px solid #333;
      color: white;
    }

    .input-dark:focus {
      border-color: #6A5ACD;
      outline: none;
      box-shadow: 0 0 6px #6A5ACD;
    }

    .btn-primary {
      background: linear-gradient(to right, #6A5ACD, #00E5FF);
      transition: 0.25s;
    }

    .btn-primary:hover {
      filter: brightness(1.2);
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }
  </style>
</head>

<body class="min-h-screen bg-black flex items-center justify-center p-4">

  <div class="max-w-md w-full p-8 rounded-xl glass shadow-xl text-white">
    <h1
      class="text-3xl font-bold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">
      Money Digital
    </h1>
    <p class="text-center text-gray-400 text-sm mb-6">Dinero Inteligente, Futuro Brillante</p>
    <h2
      class="text-2xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">
      Crear una Cuenta
    </h2>

    <form id="registerForm" class="space-y-5">

      <div>
        <label class="text-gray-300 text-sm">Nombre de usuario</label>
        <input id="r_username" type="text" required class="w-full input-dark p-3 rounded-lg" placeholder="Tu usuario">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Correo electrónico</label>
        <input id="r_email" type="email" required class="w-full input-dark p-3 rounded-lg"
          placeholder="correo@ejemplo.com">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Contraseña</label>
        <input id="r_password" type="password" required class="w-full input-dark p-3 rounded-lg"
          placeholder="Contraseña">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Confirmar contraseña</label>
        <input id="r_password2" type="password" required class="w-full input-dark p-3 rounded-lg"
          placeholder="Repite la contraseña">
      </div>

      <div>
        <label class="text-gray-300 text-sm">Tipo de usuario</label>
        <select id="r_role" required class="w-full input-dark p-3 rounded-lg">
          <option value="estudiante">Estudiante</option>
          <option value="docente">Docente</option>
        </select>
        <p class="text-gray-500 text-xs mt-1">Selecciona si eres estudiante o docente</p>
      </div>

      <!-- Sección para crear cuenta Stellar (Obligatoria) -->
      <div class="mt-6 p-4 bg-gray-800 rounded-lg border border-gray-700">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" id="createStellarAccount" class="mr-2" checked disabled>
          <span class="text-gray-300 text-sm">Crear cuenta Stellar automáticamente (Obligatorio)</span>
        </label>
        <p class="text-gray-500 text-xs mt-2">Se creará una cuenta Stellar Testnet y se financiará automáticamente para
          que puedas usar la plataforma.</p>
      </div>

      <div class="flex justify-between items-center mt-4">
        <a href="index.html" class="text-cyan-400 hover:underline text-sm">¿Ya tienes cuenta? Inicia sesión</a>

        <button type="submit" class="btn-primary px-5 py-2 rounded-lg font-semibold text-black">
          Registrarse
        </button>
      </div>
    </form>

    <div id="message" class="mt-4 text-sm p-3 rounded-lg"></div>
  </div>

  <script>
    // Funciones auxiliares para hash de contraseña (igual que en index.html)
    function buf2hex(buffer) {
      return Array.prototype.map.call(new Uint8Array(buffer), x => ('00' + x.toString(16)).slice(-2)).join('');
    }

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return buf2hex(hash);
    }

    // Funciones para cifrar clave secreta (opcional)
    function arrayBufferToB64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    async function encryptSecret(secret, password) {
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));

        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          enc.encode(password),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );

        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          enc.encode(secret)
        );

        return {
          encrypted: arrayBufferToB64(encrypted),
          salt: arrayBufferToB64(salt),
          iv: arrayBufferToB64(iv)
        };
      } catch (e) {
        console.error('Error cifrando secreto:', e);
        throw new Error('No se pudo cifrar la clave secreta');
      }
    }

    function loadUsers() {
      try {
        return JSON.parse(localStorage.getItem('users') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveUsers(users) {
      try {
        localStorage.setItem('users', JSON.stringify(users));
        return true;
      } catch (e) {
        console.error('Error guardando usuarios:', e);
        return false;
      }
    }

    // Crear y financiar cuenta Stellar Testnet
    async function createAndFundStellarAccount() {
      try {
        const StellarSdk = window.StellarSdk;
        if (!StellarSdk) {
          throw new Error('Stellar SDK no está cargado');
        }

        // Generar par de claves
        const pair = StellarSdk.Keypair.random();
        const publicKey = pair.publicKey();
        const secretKey = pair.secret();

        // Financiar con friendbot
        const response = await fetch(`https://friendbot.stellar.org?addr=${encodeURIComponent(publicKey)}`);
        const responseJSON = await response.json();

        // Esperar un momento para que la cuenta se active
        await new Promise(resolve => setTimeout(resolve, 2000));

        return {
          publicKey: publicKey,
          secretKey: secretKey,
          funded: true
        };
      } catch (error) {
        console.error('Error creando cuenta Stellar:', error);
        throw error;
      }
    }

    // Manejar el formulario de registro
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const messageDiv = document.getElementById('message');
      messageDiv.className = 'mt-4 text-sm p-3 rounded-lg';
      messageDiv.textContent = '';

      // Obtener valores del formulario
      const username = document.getElementById('r_username').value.trim();
      const email = document.getElementById('r_email').value.trim();
      const password = document.getElementById('r_password').value;
      const password2 = document.getElementById('r_password2').value;
      const createStellar = true; // Siempre obligatorio

      // Validaciones
      if (!username || username.length < 3) {
        messageDiv.textContent = '❌ El nombre de usuario debe tener al menos 3 caracteres';
        messageDiv.className += ' bg-red-900 text-red-200';
        return;
      }

      if (!email || !email.includes('@')) {
        messageDiv.textContent = '❌ Ingresa un correo electrónico válido';
        messageDiv.className += ' bg-red-900 text-red-200';
        return;
      }

      if (!password || password.length < 6) {
        messageDiv.textContent = '❌ La contraseña debe tener al menos 6 caracteres';
        messageDiv.className += ' bg-red-900 text-red-200';
        return;
      }

      if (password !== password2) {
        messageDiv.textContent = '❌ Las contraseñas no coinciden';
        messageDiv.className += ' bg-red-900 text-red-200';
        return;
      }

      // Verificar si el usuario ya existe
      const users = loadUsers();
      const userExists = users.find(u => u.username === username || u.email === email);
      if (userExists) {
        messageDiv.textContent = '❌ El usuario o correo ya está registrado';
        messageDiv.className += ' bg-red-900 text-red-200';
        return;
      }

      // Mostrar mensaje de procesamiento
      messageDiv.textContent = '⏳ Registrando usuario...';
      messageDiv.className += ' bg-blue-900 text-blue-200';

      try {
        // Hash de la contraseña
        const passwordHash = await hashPassword(password);

        // Obtener rol seleccionado
        const role = document.getElementById('r_role').value;

        // Crear objeto de usuario
        const newUser = {
          username: username,
          email: email,
          passwordHash: passwordHash,
          role: role, // 'estudiante' o 'docente'
          createdAt: new Date().toISOString()
        };

        // Crear cuenta Stellar si se solicitó
        if (createStellar) {
          try {
            messageDiv.textContent = '⏳ Creando cuenta Stellar...';
            const stellarAccount = await createAndFundStellarAccount();
            newUser.stellarPublic = stellarAccount.publicKey;

            // Cifrar la clave secreta con la contraseña del usuario
            try {
              const encrypted = await encryptSecret(stellarAccount.secretKey, password);
              newUser.encryptedSecret = encrypted.encrypted;
              newUser.encSalt = encrypted.salt;
              newUser.encIv = encrypted.iv;
            } catch (encError) {
              console.warn('No se pudo cifrar la clave secreta:', encError);
              // Continuar sin cifrar (no recomendado pero funcional)
            }
          } catch (stellarError) {
            console.error('Error creando cuenta Stellar:', stellarError);
            messageDiv.textContent = '⚠️ Usuario registrado, pero no se pudo crear la cuenta Stellar. Puedes crearla después.';
            messageDiv.className = 'mt-4 text-sm p-3 rounded-lg bg-yellow-900 text-yellow-200';
          }
        }

        // Guardar usuario
        users.push(newUser);
        if (saveUsers(users)) {
          messageDiv.textContent = '✅ Usuario registrado exitosamente! Redirigiendo...';
          messageDiv.className = 'mt-4 text-sm p-3 rounded-lg bg-green-900 text-green-200';

          // Redirigir al login después de 2 segundos
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          throw new Error('No se pudo guardar el usuario');
        }
      } catch (error) {
        console.error('Error en registro:', error);
        messageDiv.textContent = '❌ Error al registrar: ' + error.message;
        messageDiv.className += ' bg-red-900 text-red-200';
      }
    });
  </script>

</body>

</html>
